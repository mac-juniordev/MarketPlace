<svg width="200" height="200" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#22c55e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#065f46;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background rounded square -->
  <rect x="10" y="10" width="180" height="180" rx="45" fill="url(#gradient)" />
  
  <!-- M letter - both limbs and V shape -->
  <path d="M 45 145 L 45 65 L 70 100 L 95 65 L 95 145" 
        stroke="white" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" fill="none" />
  
  <!-- P letter - grows from right limb of M -->
  <!-- The vertical line of P shares the right limb of M at x=95 -->
  <!-- P bowl starts from x=95 going right -->
  <path d="M 95 85 L 130 85 C 150 85 160 95 160 105 C 160 115 150 125 130 125 L 95 125" 
        stroke="white" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" fill="none" />
</svg>